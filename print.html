<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Painel de Impressao</title>
  <link rel="stylesheet" href="styles.css?v=20260731d" />
  <style>
    body {
      padding: 24px;
    }

    .print-panel {
      max-width: 640px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .print-panel h2 {
      margin: 0;
      font-size: clamp(22px, 3vw, 28px);
      letter-spacing: 0;
    }

    .print-status {
      border: 1px solid var(--stroke);
      border-left: 4px solid var(--accent);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px;
      background: var(--surface);
      box-shadow: var(--shadow-soft);
    }

    .print-reprint {
      border: 1px solid var(--stroke);
      border-radius: 12px;
      padding: 16px;
      display: grid;
      gap: 12px;
      max-height: none;
      overflow: visible;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .print-reprint h3 {
      margin: 0;
      color: var(--accent-strong);
      font-size: 17px;
    }

    .print-student-list {
      border: 1px solid var(--stroke);
      border-radius: 10px;
      padding: 8px;
      display: grid;
      gap: 8px;
      max-height: 280px;
      overflow-y: auto;
      background: var(--surface);
    }

    .print-student-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      border: 1px solid var(--stroke);
      border-radius: 10px;
      background: #fff;
      padding: 10px 12px;
      cursor: pointer;
      user-select: none;
      box-shadow: var(--shadow-soft);
      transition: border-color 140ms ease, box-shadow 140ms ease, transform 140ms ease;
    }

    .print-student-item:hover {
      border-color: var(--accent);
      box-shadow: 0 8px 18px rgba(28, 40, 36, 0.08);
      transform: translateY(-1px);
    }

    .print-student-item.is-selected {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .print-student-item input[type="checkbox"] {
      pointer-events: none;
    }

    @media (max-width: 520px) {
      body {
        padding: 12px;
      }

      .print-reprint {
        padding: 12px;
      }
    }

    @media print {
      @page {
        size: 90mm 29mm;
        margin: 0;
      }

      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      body.print-only-label main.print-panel {
        display: flex !important;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: 0;
        width: 90mm;
        height: 29mm;
        max-width: 90mm;
      }

      body.print-only-label main.print-panel > * {
        display: none !important;
      }

      body.print-only-label main.print-panel #printLabel {
        display: flex !important;
        position: static;
        margin: 0;
      }
    }
  </style>
</head>
<body>
  <main class="print-panel">
    <h2>Painel de Etiquetas</h2>
    <div id="printAuthStatus" class="print-status">Aguardando autenticacao...</div>
    <section class="print-reprint">
      <h3>Reimprimir etiquetas</h3>
      <div id="printStudentList" class="print-student-list"></div>
    </section>
    <div id="printLabel" class="label"></div>
  </main>

  <dialog id="reprintDialog" class="dialog">
    <div class="dialog-body">
      <h3>Reimprimir etiqueta</h3>
      <div id="reprintDialogText" class="summary"></div>
      <div class="dialog-actions">
        <button id="btnCloseReprintDialog" class="ghost" type="button">Nao</button>
        <button id="btnConfirmReprintDialog" class="primary" type="button">Sim, reimprimir</button>
      </div>
    </div>
  </dialog>

  <script src="vendor/supabase-js.js?v=20260330h"></script>
  <script src="print.js?v=20260330h"></script>
</body>
</html>
